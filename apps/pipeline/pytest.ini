# Pytest — paquete apps/pipeline
# Uso desde la raíz del repo:
#   pytest -c apps/pipeline/pytest.ini --rootdir=apps/pipeline
# Desde apps/pipeline:
#   pytest

[pytest]
minversion = 7.0
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = tests
pythonpath = ..
norecursedirs =
    .git
    .tox
    .venv
    venv
    dist
    build
    __pycache__
    coverage_html_report
    logs
addopts =
    -v
    --disable-warnings
    --maxfail=3
    --durations=5
