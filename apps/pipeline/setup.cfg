# Cobertura (flake8 vive en .flake8; pytest en pytest.ini)
#
#   coverage run --rcfile=apps/pipeline/setup.cfg -m pytest -c apps/pipeline/pytest.ini
#   coverage html --rcfile=apps/pipeline/setup.cfg

[coverage:run]
branch = True
source =
    .
omit =
    */tests/*
    */__init__.py
    */venv/*
    */.venv/*
    */__pycache__/*

[coverage:report]
show_missing = True
skip_covered = True
fail_under = 60
precision = 1

[coverage:html]
directory = coverage_html_report
title = Cobertura de código - pipeline (TP Integrador)
