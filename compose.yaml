# =============================================================================
# compose.yaml — stack único del TP (raíz del repo)
# -----------------------------------------------------------------------------
# Queda en la raíz para que `docker compose up -d` y los volúmenes ./apps, ./ops
# funcionen. Imagen toolbox: docker/Dockerfile + docker/entrypoint.sh.
#
#   docker compose up -d
#   docker compose ps
#
# UI / puertos:
#   LocalStack   :4566
#   MiniStack    :4567  (RDS + Secrets DB)
#   MinIO        :9000 / consola :9001
#   postgres-bronce :5432 · postgres-dw :5433 · postgres-erp :5434
#   RDS MiniStack   :15432
#   Airflow UI      :8080  (admin / admin)     ≈ Fargate
#   ALB stand-in    :8088                      ≈ ALB → Lambda
#   pgAdmin         :5050  (admin@example.com / admin)
#
# Toolbox OpenTofu (no arranca con up -d):
#   docker compose --profile iac run --rm tp-iac apply
# =============================================================================

name: cloud-foundations-tp-integrador

# Env compartido Airflow (web / scheduler / init) — ≈ task definition Fargate
x-airflow-env: &airflow_env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@postgres-dw:5432/gold
  AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
  PYTHONPATH: /opt/airflow/packages
  # LocalExecutor corre tasks EN el scheduler. Sin esto, wait_for_infra falla
  # (boto3/psycopg2 solo se instalaban en airflow-init, que es otro container).
  _PIP_ADDITIONAL_REQUIREMENTS: psycopg2-binary boto3

#Variables de entorno del bloque x-airflow-env (webserver, scheduler e init).
#Sirven para que los DAGs / pipeline hablen con MiniStack y la RDS desde dentro de Docker.
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_DEFAULT_REGION: us-east-1
  SECRETS_ENDPOINT: http://ministack-integrador:4566
  RDS_HOST_OVERRIDE: host.docker.internal
  # MiniStack puede publicar 15432 / 15433 / 15434 — alineá con `docker ps --filter name=ministack-rds`
  RDS_PORT_OVERRIDE: "${RDS_PORT_OVERRIDE:-15432}"
  RDS_ETL_SECRET: dw/rds-etl
  ORIGEN_SECRET: dw/origen-demo
  ERP_SECRET: dw/erp
#En corto: las tres AWS_* autentican el SDK contra el emulador; SECRETS_ENDPOINT apunta a MiniStack;
#los RDS_*_OVERRIDE corrigen cómo Airflow llega a la base; los *_SECRET nombran qué secret leer.

x-airflow-volumes: &airflow_volumes
  - ./apps/airflow/dags:/opt/airflow/dags
  - ./apps/airflow/logs:/opt/airflow/logs
  - ./apps/pipeline:/opt/airflow/packages/pipeline

services:
  # ---------------------------------------------------------------------------
  # Orígenes Postgres
  # ---------------------------------------------------------------------------
  postgres-bronce:
    image: postgres:16
    container_name: postgres-bronce
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB_BRONCE:-bronce}
    ports:
      - "${POSTGRES_BRONCE_PORT:-5432}:5432"
    volumes:
      - postgres-data-bronce:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB_BRONCE:-bronce}"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-dw:
    image: postgres:16
    container_name: postgres-dw
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB_DW:-gold}
    ports:
      - "${POSTGRES_DW_PORT:-5433}:5432"
    volumes:
      - postgres-data-dw:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB_DW:-gold}"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-erp:
    image: postgres:16
    container_name: postgres-erp
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB_ERP:-erp}
    ports:
      - "${POSTGRES_ERP_PORT:-5434}:5432"
    volumes:
      #Inicia postgresql e inserta la semilla como mock de información con origen en el ERP.
      - postgres-data-erp:/var/lib/postgresql/data
      - ./apps/pipeline/erp/seed_erp.sql:/docker-entrypoint-initdb.d/01_seed_erp.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB_ERP:-erp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Data lake S3 (MinIO) — decisión 002
  # ---------------------------------------------------------------------------
  s3-soporte:
    image: minio/minio
    container_name: s3-soporte
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY:-tp-lab-key:YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXowMTIzNDU=}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7
    container_name: redis-integrador
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------------------
  # LocalStack — IAM / VPC / Lambda / Logs (S3 del TP = MinIO)
  # ---------------------------------------------------------------------------
  localstack-integrador:
    image: localstack/localstack:latest
    container_name: localstack-integrador
    environment:
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:?Set LOCALSTACK_AUTH_TOKEN (Hobby)}
      SERVICES: sqs,sns,lambda,dynamodb,events,cloudwatch,logs,iam,ec2,secretsmanager
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      PERSISTENCE: "1"
    ports:
      - "4566:4566"
    volumes:
      - localstack-data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # RDS Postgres real + Secrets DB. Host :4567 → interno :4566
  ministack-integrador:
    image: ministackorg/ministack:latest
    container_name: ministack-integrador
    environment:
      PERSIST_STATE: "1"
      RDS_PERSIST: "1"
      S3_PERSIST: "0"
      LOG_LEVEL: INFO
      RDS_BASE_PORT: "15432"
    ports:
      - "4567:4566"
    volumes:
      - ministack-data:/tmp/ministack-state
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ---------------------------------------------------------------------------
  # Airflow ≈ ECS Fargate + EFS stand-in
  # DAGs/logs: apps/airflow/ 
  # ---------------------------------------------------------------------------
  airflow-init:
    image: apache/airflow:2.9.3-python3.12
    entrypoint: /bin/bash
    command:
      - -c
      - |
        pip install --quiet psycopg2-binary boto3 &&
        airflow db migrate &&
        airflow users create --username admin --password admin \
          --firstname A --lastname A --role Admin --email a@a.com || true
    environment: *airflow_env
    volumes: *airflow_volumes
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres-dw:
        condition: service_healthy

  airflow-webserver:
    image: apache/airflow:2.9.3-python3.12
    container_name: airflow-webserver-integrador
    command: webserver
    ports:
      - "8080:8080"
    environment: *airflow_env
    volumes: *airflow_volumes
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres-dw:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    image: apache/airflow:2.9.3-python3.12
    container_name: airflow-scheduler-integrador
    command: scheduler
    environment: *airflow_env
    volumes: *airflow_volumes
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres-dw:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  # One-shot: dispara etl_erp_to_bronce en cada compose up (≈ post-infra).
  # @once no sirve: Airflow lo consume en postgres-dw y no re-corre al reiniciar.
  # wait_for_infra del DAG espera secrets/RDS si tofu apply todavía no terminó.
  airflow-bootstrap:
    image: apache/airflow:2.9.3-python3.12
    container_name: airflow-bootstrap-integrador
    restart: "no"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        echo "bootstrap: esperando parse de etl_erp_to_bronce..."
        i=0
        while [ "$$i" -lt 90 ]; do
          if airflow dags list 2>/dev/null | grep -q etl_erp_to_bronce; then
            airflow dags unpause etl_erp_to_bronce || true
            airflow dags trigger etl_erp_to_bronce
            echo "bootstrap: triggered etl_erp_to_bronce"
            exit 0
          fi
          i=$$((i + 1))
          sleep 2
        done
        echo "bootstrap: timeout esperando el DAG" >&2
        exit 1
    environment: *airflow_env
    volumes: *airflow_volumes
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres-dw:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      airflow-scheduler:
        condition: service_started

  # ---------------------------------------------------------------------------
  # ALB stand-in ≈ entrada pública  (Hobby no tiene ELBv2)
  #Emula el rol del ALB en el to-be
  #Mediante un contenedor Compose (apps/api/alb_standin) que:
    #Expone HTTP en :8088 (entrada “pública” local).
    #Recibe el request (p. ej. query gold).
    #Invoca la Lambda tp-gold-api en LocalStack (:4566).
    #Devuelve la respuesta al cliente (Postman/browser).
  # Postman → :8088 → Lambda en LocalStack
  # ---------------------------------------------------------------------------
  alb-standin:
    build:
      context: ./apps/api/alb_standin
      dockerfile: Dockerfile
    image: tp-alb-standin:latest
    container_name: alb-standin-integrador
    ports:
      - "8088:8088"
    environment:
      LOCALSTACK_ENDPOINT: http://localstack-integrador:4566
      LAMBDA_FUNCTION_NAME: tp-gold-api
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      PORT: "8088"
    depends_on:
      localstack-integrador:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # pgAdmin — UI para Postgres (orígenes + RDS MiniStack)
  # Login: http://localhost:5050  →  admin@example.com / admin
  # (.local no pasa el validador de email de pgAdmin 8)
  # Servers prearmados: bronce / dw(Airflow) / erp. RDS: dwadmin + secret dw/rds-master.
  # ---------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: pgadmin-integrador
    user: root
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_LISTEN_PORT: "80"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./ops/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./ops/pgadmin/pgpass:/tmp/pgpass:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres-bronce:
        condition: service_healthy
      postgres-dw:
        condition: service_healthy
      postgres-erp:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        cp /tmp/pgpass /tmp/pgpass.chmod
        chown 5050:5050 /tmp/pgpass.chmod
        chmod 600 /tmp/pgpass.chmod
        export PGPASSFILE=/tmp/pgpass.chmod
        exec /entrypoint.sh

  # ---------------------------------------------------------------------------
  # Toolbox OpenTofu — NO arranca con up -d (profile iac)
  # Es un contenedor de herramientas para aplicar el IaC del TP sin instalar OpenTofu en Windows.
    #OpenTofu (tofu) — aplica infra/
    #AWS CLI, Python, deps del repo
    #Docker CLI + socket — scripts post-apply (p. ej. seed RDS vía docker exec)
    #Monta infra/, apps/, data/ y apunta endpoints a LocalStack / MiniStack / MinIO.
  # ---------------------------------------------------------------------------
  tp-iac:
    profiles: ["iac"]
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: tp-integrador-iac:latest
    container_name: tp-integrador-iac
    working_dir: /workspace
    environment:
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      LOCALSTACK_ENDPOINT: http://localstack-integrador:4566
      MINISTACK_ENDPOINT: http://ministack-integrador:4566
      MINIO_ENDPOINT: http://s3-soporte:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      TF_VAR_localstack_endpoint: http://localstack-integrador:4566
      TF_VAR_ministack_endpoint: http://ministack-integrador:4566
      TF_VAR_minio_endpoint: http://s3-soporte:9000
      TF_VAR_minio_access_key: ${MINIO_ROOT_USER:-minioadmin}
      TF_VAR_minio_secret_key: ${MINIO_ROOT_PASSWORD:-minioadmin}
      TF_VAR_repo_root: ".."
    volumes:
      - ./infra:/workspace/infra
      - ./apps:/workspace/apps
      - ./data:/workspace/data:ro
      - ./docker/entrypoint.sh:/usr/local/bin/entrypoint-iac.sh:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      localstack-integrador:
        condition: service_healthy
      ministack-integrador:
        condition: service_healthy
      s3-soporte:
        condition: service_healthy

volumes:
  postgres-data-bronce:
  postgres-data-dw:
  postgres-data-erp:
  minio-data:
  redis-data:
  localstack-data:
  ministack-data:
  pgadmin-data:
