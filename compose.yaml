services:
  postgres-bronce:
    image: postgres:16
    container_name: postgres-bronce
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB_BRONCE:-bronce}
    ports:
      # Puerto host propio — NO reusar POSTGRES_PORT (chocaba con postgres-dw)
      - "${POSTGRES_BRONCE_PORT:-5432}:5432"
    volumes:
      - postgres-data-bronce:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB_BRONCE:-bronce}"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-dw:
    image: postgres:16
    container_name: postgres-dw
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB_DW:-gold}
    ports:
      - "${POSTGRES_DW_PORT:-5433}:5432"
    volumes:
      - postgres-data-dw:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB_DW:-gold}"]
      interval: 5s
      timeout: 5s
      retries: 10

  s3-soporte:
    image: minio/minio
    container_name: s3-soporte
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      # KMS mínimo para lab: habilita put-bucket-encryption / SSE-S3 (NO usar en prod)
      # Formato: <nombre-key>:<32-bytes-en-base64>
      # Debe ser name:<base64 de exactamente 32 bytes>. La clave anterior tenía 29 y MinIO abortaba.
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY:-tp-lab-key:YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXowMTIzNDU=}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      # curl ya no viene en la imagen MinIO; mc sí
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7
    container_name: redis-integrador
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  localstack-integrador:
    image: localstack/localstack:latest
    container_name: localstack-integrador
    environment:
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:?Set LOCALSTACK_AUTH_TOKEN (Hobby)}
      # S3 del TP = MinIO (:9000). LocalStack S3 queda fuera para no duplicar el lake (decisión 002).
      # Para reactivar S3 en LocalStack, descomentar "s3," en la lista:
      # SERVICES: s3,sqs,sns,lambda,dynamodb,events,cloudwatch,logs,iam,ec2,secretsmanager
      SERVICES: sqs,sns,lambda,dynamodb,events,cloudwatch,logs,iam,ec2,secretsmanager
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      # Persiste IAM/EC2/VPC/etc. en el volumen localstack-data entre reinicios.
      # Sin esto, un restart deja solo la VPC default (como pasó con tp-integrador-vpc).
      # Ojo: `docker compose down -v` borra el volumen y sí pierde todo.
      PERSISTENCE: "1"
    ports:
      - "4566:4566"
    volumes:
      - localstack-data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # RDS Postgres real + Secrets DB. :4567 para no pisar LocalStack S3 (:4566).
  ministack-integrador:
    image: ministackorg/ministack:latest
    container_name: ministack-integrador
    environment:
      PERSIST_STATE: "1"
      RDS_PERSIST: "1"
      S3_PERSIST: "0"
      LOG_LEVEL: INFO
      # Evita chocar con postgres-bronce :5432 / postgres-dw :5433 en el host
      RDS_BASE_PORT: "15432"
    ports:
      - "4567:4566"
    volumes:
      - ministack-data:/tmp/ministack-state
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres-data-bronce:
  postgres-data-dw:
  minio-data:
  redis-data:
  localstack-data:
  ministack-data:
