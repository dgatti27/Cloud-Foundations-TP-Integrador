# Stand-in local del lab 09b-tp:
# Airflow ≈ ECS Fargate; volumen ./efs-standin ≈ EFS (DAGs + logs)
#
# Uso:
#   docker compose -f ecs/docker-compose.airflow.yaml up -d
#   UI http://localhost:8080  (admin / admin)

services:
  airflow-init:
    image: apache/airflow:2.9.3-python3.12
    entrypoint: /bin/bash
    command:
      - -c
      - |
        pip install --quiet psycopg2-binary boto3 &&
        airflow db migrate &&
        airflow users create --username admin --password admin \
          --firstname A --lastname A --role Admin --email a@a.com || true
    environment: &airflow_env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@postgres-dw:5432/gold
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      SECRETS_ENDPOINT: http://ministack-integrador:4566
      RDS_HOST_OVERRIDE: host.docker.internal
      RDS_PORT_OVERRIDE: "15432"
      ORIGEN_SECRET: dw/origen-demo
    volumes:
      - ./efs-standin/dags:/opt/airflow/dags
      - ./efs-standin/logs:/opt/airflow/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default

  airflow-webserver:
    image: apache/airflow:2.9.3-python3.12
    command: webserver
    ports:
      - "8080:8080"
    environment: *airflow_env
    volumes:
      - ./efs-standin/dags:/opt/airflow/dags
      - ./efs-standin/logs:/opt/airflow/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - airflow-init

  airflow-scheduler:
    image: apache/airflow:2.9.3-python3.12
    command: scheduler
    environment: *airflow_env
    volumes:
      - ./efs-standin/dags:/opt/airflow/dags
      - ./efs-standin/logs:/opt/airflow/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - airflow-init

networks:
  default:
    name: cloud-foundations-tp-integrador_default
    external: true
