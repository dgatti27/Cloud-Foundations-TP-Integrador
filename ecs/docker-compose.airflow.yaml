# Stand-in local del lab 09b-tp:
#   Airflow ≈ ECS Fargate
#   ./efs-standin/dags  ≈ EFS access point /airflow/dags  (TODOS los DAGs viven acá)
#   ./efs-standin/logs  ≈ EFS access point /airflow/logs
#   ../etl              ≈ código de librería (imagen/EFS en AWS; no reemplaza el EFS de DAGs)
#
# Uso:
#   docker compose -f ecs/docker-compose.airflow.yaml up -d
#   UI http://localhost:8080  (admin / admin)

services:
  airflow-init:
    image: apache/airflow:2.9.3-python3.12
    entrypoint: /bin/bash
    command:
      - -c
      - |
        pip install --quiet psycopg2-binary boto3 &&
        airflow db migrate &&
        airflow users create --username admin --password admin \
          --firstname A --lastname A --role Admin --email a@a.com || true
    environment: &airflow_env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@postgres-dw:5432/gold
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      # Paquete etl/ montado en /opt/airflow/packages/etl (lab-extra + 09b)
      PYTHONPATH: /opt/airflow/packages
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      SECRETS_ENDPOINT: http://ministack-integrador:4566
      RDS_HOST_OVERRIDE: host.docker.internal
      RDS_PORT_OVERRIDE: "15432"
      RDS_ETL_SECRET: dw/rds-etl
      # Lab 09b demo origen; lab-extra usa dw/erp (ERP_SECRET)
      ORIGEN_SECRET: dw/origen-demo
      ERP_SECRET: dw/erp
    volumes:
      - ./efs-standin/dags:/opt/airflow/dags
      - ./efs-standin/logs:/opt/airflow/logs
      - ../etl:/opt/airflow/packages/etl
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default

  airflow-webserver:
    image: apache/airflow:2.9.3-python3.12
    command: webserver
    ports:
      - "8080:8080"
    environment: *airflow_env
    volumes:
      - ./efs-standin/dags:/opt/airflow/dags
      - ./efs-standin/logs:/opt/airflow/logs
      - ../etl:/opt/airflow/packages/etl
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - airflow-init

  airflow-scheduler:
    image: apache/airflow:2.9.3-python3.12
    command: scheduler
    environment: *airflow_env
    volumes:
      - ./efs-standin/dags:/opt/airflow/dags
      - ./efs-standin/logs:/opt/airflow/logs
      - ../etl:/opt/airflow/packages/etl
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - airflow-init

networks:
  default:
    name: cloud-foundations-tp-integrador_default
    external: true
