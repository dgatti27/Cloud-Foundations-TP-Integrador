# ============================================================================
#  GitHub Actions — CI del TP Integrador
#
#  Corre en push a main/master, en cada PR y con disparo manual.
#  No levanta LocalStack ni Docker de producto: solo validaciones estáticas /
#  smoke sin red ni DB.
# ============================================================================

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  python-etl:
    name: Python / ETL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar herramientas
        run: python -m pip install --upgrade pip ruff
      - name: Instalar dependencias ETL
        run: pip install -r apps/pipeline/requirements.txt
      - name: Lint (ruff, errores reales)
        run: ruff check --select E9,F63,F7,F82 apps/pipeline apps/airflow/dags apps/api
      - name: Compilar (py_compile)
        run: |
          set -euo pipefail
          mapfile -t etl_py < <(git ls-files 'apps/pipeline/**/*.py' 'apps/pipeline/*.py')
          mapfile -t dag_py < <(git ls-files 'apps/airflow/dags/*.py')
          mapfile -t api_py < <(git ls-files 'apps/api/*.py')
          python -m py_compile "${etl_py[@]}" "${dag_py[@]}" "${api_py[@]}"
          echo "py_compile OK (${#etl_py[@]} etl + ${#dag_py[@]} dags + ${#api_py[@]} api)"
      - name: Import + smoke (sin DB)
        env:
          PYTHONPATH: apps
        run: |
          python - <<'PY'
          from pipeline.extract import EXTRACTORS
          from pipeline.transform import normalize_records, transform_to_gold
          from pipeline.load import load_to_cruda, load_to_dw

          expected = {"erp", "erp-foxpro", "bronce"}
          assert set(EXTRACTORS) == expected, EXTRACTORS

          # APIs legacy / transform sin tocar Postgres ni Secrets
          n = load_to_cruda(normalize_records([{"x": 1}], "demo"), "demo")
          assert n == 1
          assert load_to_dw() == 0
          bundle = transform_to_gold([], [], [])
          assert set(bundle) >= {
              "dim_fecha",
              "dim_cliente",
              "dim_producto",
              "dim_canal",
              "dim_metodo_pago",
              "dim_moneda",
              "fact_venta_linea",
          }
          print("etl smoke OK")
          PY

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n (sintaxis)
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.sh')
          if ((${#files[@]} == 0)); then
            echo "No hay scripts .sh versionados"
            exit 0
          fi
          for f in "${files[@]}"; do
            bash -n "$f" && echo "OK $f"
          done
      - name: ShellCheck (producto)
        # Solo entrypoint de la imagen IaC; labs/*.sh son demos CLI (awslocal).
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          mapfile -t files < <(git ls-files 'docker/*.sh' 'ops/scripts/*.sh')
          if ((${#files[@]} == 0)); then
            echo "No hay scripts de producto para ShellCheck"
            exit 0
          fi
          shellcheck --severity=error "${files[@]}"
          echo "shellcheck OK"

  opentofu:
    name: OpenTofu (IaC)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.8.8"
      - name: Format check
        run: tofu fmt -check -recursive -diff
        continue-on-error: true
      - name: Init (sin backend)
        run: tofu init -backend=false
      - name: Validate
        run: tofu validate

  compose:
    name: Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar compose.yaml
        # Solo parsea el YAML; no levanta servicios. Dummy para satisfacer
        # ${LOCALSTACK_AUTH_TOKEN:?...} (el token real solo hace falta en runtime local).
        env:
          LOCALSTACK_AUTH_TOKEN: ci-dummy-token
        run: docker compose -f compose.yaml config -q && echo "compose OK"

  finops:
    name: FinOps (costos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validar services.json y estimador
        working-directory: labs/finops
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -c "import json; json.load(open('services.json', encoding='utf-8')); print('services.json OK')"
          python pricing.py --services services.json --budget 300
